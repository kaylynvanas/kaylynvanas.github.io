# Pulls the latest Substack posts into _data/substack.json once a day.
# Committing the file triggers a normal GitHub Pages rebuild.
name: Update Substack posts

on:
  schedule:
    - cron: "0 5 * * *" # 07:00 in Cape Town
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_substack.py
      - name: Commit if posts changed
        run: |
          git add _data/substack.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Substack posts"
          git push
