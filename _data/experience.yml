# Newest first. Copy a block to add a role. "end" can be "Present".
# logo is optional: a square image in images/.
# url is optional: the company or product site, linked under the title.
# summary: one paragraph, or a list of them (one entry per paragraph).
# groups: each becomes a small card under the summary; 2-4 groups of 2-4 items read best.
#   A group with intro paragraphs or sections spans the full row, since it carries more text.
#   sections (each a lead line plus items) split a big card into parts. wide: true forces full width;
#   wide: false keeps a card with an intro at half width.
#   An item can be text plus its own items, for nested bullets.
- role: Software Engineer
  company: Adsum Technologies
  url: https://opentax.adsum-works.com/
  logo: /images/adsum.jpeg
  start: Apr 2025
  end: Present
  summary:
    - >-
      I joined Adsum, a UK fintech startup, as a backend engineer. Since joining, I've been
      delivering and owning features end to end across the entire stack, and I am now the
      largest contributor to 14 repositories at ~31%.
    - >-
      I build OpenTax, a SaaS platform that pulls UK tax data directly from HMRC (the UK tax
      authority), and from Xero and QuickBooks (accounting software). 830+ UK accountancy
      practices onboarded, 10900+ client payment reminder emails sent, and thousands of
      month-end agent checks run on real client ledgers. OpenTax was nominated for two Digital
      Disruptor awards in 2025: Digital Newcomer of the Year and Release of the Year.
  groups:
    - title: Production ownership
      items:
        - <strong>Main production-support engineer</strong>, owning hundreds of incidents end to end.
        - <strong>Co-leader of a new embedded finance project</strong> with a British “unicorn” challenger bank.
        - <strong>Owner of the build and evals</strong> of numerous customer-facing agents.
        - <strong>Co-owner of the OpenTax public API</strong>, built with a colleague.
        - <strong>Co-owner of the OpenTax product backlog</strong> since October 2026.
        - <strong>Owner of the OpenTax pipeline health bot</strong>, which triages nightly Airflow failures and drafts fix PRs.
        - <strong>Owner of the OpenTax Agents nightly robustness routines</strong>, inherited from the outgoing principal engineer, which find production issues and open draft fix PRs.
    - title: OpenTax SaaS
      items:
        - <strong>Role-based access control</strong>, plus MFA and lockouts on InstantVAT logins and bank-detail changes.
        - <strong>In-house authenticator</strong> that kept automated HMRC logins working after HMRC introduced MFA.
        - <strong>“Time Machine” tax balances</strong> for VAT, PAYE and Corporation Tax, plus the Self Assessment dashboard and duplicate-client merging.
        - <strong>Editable payment reminder templates</strong> with locked HMRC bank details to prevent fraud, plus new-client alerts.
        - <strong>Cursor-based pagination</strong> for practices with 10,000+ clients, and exports cut from 2+ hour timeouts to under 3 minutes.
        - <strong>ETL pipeline observability</strong> with structured CloudWatch logging and named failure modes at every stage.
    - title: "OpenTax Agents: August 2025"
      wide: false
      intro:
        - "First generation: an accountant chat assistant that drafts tax payment reminder emails."
      items:
        - <strong>Bulk reminder drafting</strong> from accountants’ plain-English instructions, for every matching client with the right tax data and references, streamed as each draft completes, with per-client timeouts and retries.
        - <strong>Deterministic figures</strong>, with dates, overdue logic, amounts and payment references handled in code so the model can’t invent them.
        - <strong>Live tax data tools</strong> for tax portal login and sessions.
        - <strong>Agent foundations</strong>, including the tool-calling loop, tax-type detection, the initial database schema, WebSocket streaming of progress and browser screenshots, and LangSmith tracing.
    - title: "OpenTax Agents: April 2026"
      wide: false
      intro:
        - "Second generation: multi-agent month-end bookkeeping."
      items:
        - <strong>Month-end review agents</strong> for payroll reconciliation, marketplace payouts and capital expenditure wrongly booked as an expense, plus VAT checks tuned against labelled evals.
        - <strong>A payout-parsing tool</strong> that totals in code after the model’s in-context sums proved wrong. On real 800+ row payouts it matched every row to the penny.
        - <strong>Labelled eval sets</strong> with deterministic ground truth from accountant-approved pass and fail labels.
        - <strong>Eval-driven tuning</strong> on labelled snapshots of real client ledgers, raising agent accuracy to over 90%, plus consistency tests that caught faults before release.
        - <strong>Led two full-stack UI overhauls</strong> and the accountant onboarding flow.
  tech: [Python, FastAPI, Flask, TypeScript, Node.js, PostgreSQL, Airflow, Playwright, React, Claude Agent SDK, LangGraph, LangSmith, AWS, Terraform, Kubernetes, Redis, GitHub, Sentry, New Relic, Postmark]

- role: Data Analyst
  company: "&Wider"
  url: https://www.andwider.com/
  logo: /images/andwider.jpeg
  start: Oct 2020
  end: Apr 2025
  summary:
    - >-
      I was an early technical hire in a lean tech team at &Wider, a Dutch social impact
      startup. I worked across data engineering, analytics engineering, business analysis,
      data analysis and QA, and helped build its two products from scratch.
    - >-
      Engage is a progressive web app that lets global brands monitor human-rights impacts and
      working conditions across their supply chains. Landscape Assessments are multi-brand
      studies that benchmark human-rights risk across a shared sourcing region or sector.
  groups:
    - title: Data engineering
      items:
        - "<strong>Owned the data behind every client report and dashboard</strong>: its accuracy, structure and delivery."
        - <strong>Designed the database and data structures</strong> behind Engage.
        - <strong>Designed, built and maintained ETL pipelines</strong> in Python and SQL.
        - "<strong>Collected, cleaned and transformed highly sensitive, anonymised worker-survey data</strong> from WhatsApp, WeChat, online forms and automated phone surveys (IVR): over 1 million data points from respondents across 70+ countries."
    - title: Analytics and reporting
      items:
        - <strong>Analysed survey data</strong> to report insights and trends to clients.
        - <strong>Built Landscape Assessments</strong>, a paid &Wider product in which several global brands jointly fund a survey of a shared sourcing region or sector. Each brand benchmarks its own suppliers against the aggregated results to see how its human-rights risk compares. I delivered assessments covering cocoa, sugar, logistics and agriculture across five continents.
    - title: Product and quality
      items:
        - <strong>Designed the full Engage user journey</strong>, from login to the data dashboards, and wrote the user stories and wireframes behind it.
        - <strong>Designed the supplier risk scoring and traffic-light system</strong> that flags high- and low-risk suppliers.
        - "<strong>Designed the anonymity rules that protect workers</strong>: dashboard filters such as gender switch off automatically when a group is small enough to identify someone (e.g. the only woman at a site)."
        - <strong>QA-tested features and fixes</strong> before release.
        - <strong>Documented team workflows and processes</strong>.
  tech: [Python, pandas, NumPy, SQL Server, Power BI, Looker Studio, Jotform, WhatsApp, WeChat, Telerivet, Twilio, Azure, Postman]
