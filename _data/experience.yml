# Newest first. Copy a block to add a role. "end" can be "Present".
# logo is optional: a square image in images/.
# groups: each becomes a small card under the summary; 2-4 groups of 2-4 items read best.
- role: Software Engineer
  company: Adsum
  logo: /images/adsum.jpeg
  start: Apr 2025
  end: Present
  summary: >-
    I build OpenTax, a UK fintech SaaS that pulls tax data from HMRC, Xero and QuickBooks
    so accountants can track what every client owes. 830+ practices have onboarded, and it
    was nominated for two Digital Disruptor awards in 2025. I joined as a backend engineer
    and now own features end to end across the stack.
  groups:
    - title: AI agents
      items:
        - Core engineer on two generations of customer-facing AI agents, both in production with real accounting firms.
        - "Multi-agent month-end reviews on the Claude Agent SDK: payroll, marketplace payouts, assets and VAT."
        - Raised VAT check accuracy from under 50% to over 90% with golden datasets and benchmarks.
        - MCP tools that log in to HMRC and fetch live tax data; LangSmith tracing.
    - title: Production ownership
      items:
        - "Main production-support engineer: hundreds of incidents from customer report to post-mortem."
        - Built a pipeline health bot that triages nightly Airflow failures and drafts fix PRs.
        - Co-owner of the OpenTax product backlog since October 2026.
        - Wrote the structured-logging standard and runbooks for the support knowledge base.
    - title: Platform features
      items:
        - Public REST API with usage tracking and rate limiting (Redis, AWS WAF, Terraform).
        - Role-based access control and a "time machine" for any past balance.
        - In-house authenticator so automated HMRC logins survived HMRC's move to MFA.
        - "Privacy-compliant analytics: PostHog in, ad trackers out."
    - title: Reliability and data integrity
      items:
        - Found and fixed £1.8m of missing year-end payroll tax adjustments across 798 clients.
        - Restored ~104,000 lost Corporation Tax filing periods for ~9,800 clients.
        - Fixed client discovery after an HMRC change dropped success from 97.8% to 0.02%.
        - Cut large exports from hours to under 3 minutes.
  tech: [Python, FastAPI, TypeScript, React, PostgreSQL, Airflow, Claude Agent SDK, LangGraph, AWS, Terraform]

