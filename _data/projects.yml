- name: actually.
  title: Nutrition tracking MCP server
  mark: a
  image: /images/actually.webp
  media_alt: The askactually.co.za landing page, with a chat where Claude logs a breakfast through actually.
  summary:
    - >-
      The MCP server turns the AI assistant you already use (e.g. Claude) into a nutrition
      tracker. Connect it to your AI assistant, tell it what you ate, and it looks each food up
      in a South African food database, asks only the questions that change the numbers, and
      logs just the nutrients you care about (calories, protein, carbohydrates, fibre, fat
      and/or sugar).
    - The South African food database is hand-built by me, and a constant work in progress.
    - This is not a medical device and doesn't replace advice from your doctor or dietitian.
  url: https://askactually.co.za

- name: kaylynvanas/skills
  title: Systems design coaching skill for Claude Code
  icon: fa-brands fa-github
  summary: >-
    <strong>/coaching-systems-design</strong> keeps me sharp. Day to day I work AI-first and fast, and AI tools
    can iterate on a ticket until it works. But I still own the outcome, and not every team
    works this way, so I don’t want my own thinking to fall behind. And ultimately, it’s my
    responsibility to know what’s going on in the systems I build. Before I write any code,
    the skill coaches me through the ticket like a systems design interview: one question at a
    time, hints when I’m stuck, and a log of my gaps to revisit on future tickets.
  repo: https://github.com/kaylynvanas/skills
