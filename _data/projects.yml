# Strongest first. Copy a block to add one.
# Each project is a row: media on one side, the write-up on the other. Keep work projects to a
# short "what it is" plus a result: Experience carries the detail of what I did.
#
# name:      product, repo or company name, shown small above the heading with the logo.
# title:     the heading: what it is, not what it's called.
# mark:      a letter drawn as actually.'s brand mark; or
# logo:      a square image in images/, e.g. a company logo; or
# icon:      a Font Awesome class for the logo instead, e.g. "fa-brands fa-github".
# summary:   one paragraph, or a list for several.
# video:     a short screen recording, e.g. /images/actually-demo.mp4. Keep it under ~10 MB:
#            it plays muted on a loop. Give it a poster: a still image shown until it loads.
# image:     a screenshot instead of a video, e.g. /images/skills.png.
# media_alt: what the video or screenshot shows, for screen readers.
# url, repo: links; leave either out to hide it.
# Without a video or image, the text takes the whole row.
